name: Build and publish Folder Popup

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build .plasmoid and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes zip unzip

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" == "$GITHUB_REF_NAME" ]]; then
            echo "Tag must start with v, for example v1.0.24" >&2
            exit 1
          fi

          PACKAGE_VERSION="$(python3 -c 'import json; print(json.load(open("package/metadata.json", encoding="utf-8"))["KPlugin"]["Version"])')"

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package/metadata.json ($PACKAGE_VERSION)." >&2
            echo "Update KPlugin.Version in package/metadata.json, commit the change, then create the tag." >&2
            exit 1
          fi

          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Build and verify .plasmoid
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh

          PACKAGE="io.github.wadehusky.folderpopup-${VERSION}.plasmoid"
          test -s "$PACKAGE"
          unzip -t "$PACKAGE"

      - name: Create GitHub Release and upload .plasmoid
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="io.github.wadehusky.folderpopup-${VERSION}.plasmoid"

          gh release create "v${VERSION}" "$PACKAGE" \
            --title "Folder Popup ${VERSION}" \
            --generate-notes \
            --verify-tag

